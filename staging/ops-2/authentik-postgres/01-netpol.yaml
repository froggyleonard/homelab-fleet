# This is a REPLACEMENT for the existing authentik-egress policy, not an
# additional independently managed policy. During a later rollout it must
# replace that resource in the active Authentik graph before DB pods start.
# Kubernetes policies are additive: the old podSelector={} would otherwise
# give the database and backup pods the application's external egress.
# Current Authentik destinations, including the shared source DB, are retained.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-egress
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
---
# The namespace's existing default-deny remains. This explicit DB policy also
# documents that preparation permits no ingress or egress. A later activation
# policy must grant only the required app/backup ingress after restore gates.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-postgres-deny
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-postgres
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgres
      app.kubernetes.io/component: db
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# This pod is also denied ingress. Its only potential egress is DNS and the
# dedicated DB; DB ingress is still denied until the later activation policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-postgres-backup
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgres
      app.kubernetes.io/component: backup
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik-postgres
              app.kubernetes.io/component: db
      ports:
        - port: 5432
          protocol: TCP
