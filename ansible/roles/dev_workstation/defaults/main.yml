dev_workstation_claude_code_version: "2.1.224"
# renovate: datasource=npm depName=@openai/codex
dev_workstation_codex_version: "0.147.0"
# renovate: datasource=npm depName=@agentclientprotocol/claude-agent-acp
dev_workstation_claude_agent_acp_version: "0.66.0"

