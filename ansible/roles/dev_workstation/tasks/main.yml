---
# Baseline — the dev twin of common_hardening, deliberately WITHOUT the
# Kubernetes node prep (modprobe/sysctls/swapoff/open-iscsi). A shared
# common_base split is a deferred follow-up (task 013, D4).
- name: Update apt cache and upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - unattended-upgrades
      - nftables
      - chrony
      - curl
      - ca-certificates
      - gnupg
    state: present

- name: Enable qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Harden sshd — key-only, no root (same content as fleet drop-in)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-dev-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 4
  notify: Restart sshd

- name: Configure unattended-upgrades — security only, no auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52-dev-unattended.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

# Dev tooling
- name: Install dev packages
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - ripgrep
      - fd-find
      - fzf
      - jq
      - tmux
      - unzip
      - python3-venv
      - sqlite3
    state: present

- name: Ensure apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add GitHub CLI apt key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add GitHub CLI apt repo
  ansible.builtin.deb822_repository:
    name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg

- name: Install gh
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Add NodeSource apt key (dearmored)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
      | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg
    executable: /bin/bash

- name: Add NodeSource apt repo
  ansible.builtin.deb822_repository:
    name: nodesource
    uris: "https://deb.nodesource.com/node_{{ dev_workstation_node_major }}.x"
    suites: nodistro
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/nodesource.gpg

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install pinned npm CLIs (claude-code, codex)
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
  loop:
    - { name: "@anthropic-ai/claude-code", version: "{{ dev_workstation_claude_code_version }}" }
    - { name: "@openai/codex", version: "{{ dev_workstation_codex_version }}" }

# JetBrains Remote Development backend (IntelliJ IDEA Ultimate) is
# auto-provisioned by Gateway over SSH — nothing to install here. Raise the
# inotify watch budget per JetBrains' file-watcher recommendation.
- name: Raise inotify watch limit for the JetBrains backend
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    sysctl_file: /etc/sysctl.d/90-jetbrains.conf
    reload: true

- name: Add Tailscale apt key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repo
  ansible.builtin.deb822_repository:
    name: tailscale
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: noble
    components: main
    signed_by: /etc/apt/keyrings/tailscale-archive-keyring.gpg

- name: Install tailscale (daemon up, logged out — `tailscale up` is a user step)
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# Antigravity CLI — official installer, SHA512-verified, self-updating.
# Per-user install; runs unprivileged as {{ dev_workstation_user }}.
- name: Install Antigravity CLI (agy)
  become: false
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://antigravity.google/cli/install.sh | bash
  args:
    creates: "/home/{{ dev_workstation_user }}/.local/bin/agy"
    executable: /bin/bash

- name: Record provisioned agy version (self-updates; not pinnable)
  become: false
  ansible.builtin.command: "/home/{{ dev_workstation_user }}/.local/bin/agy --version"
  register: dev_workstation_agy_version
  changed_when: false

- name: Show provisioned agy version
  ansible.builtin.debug:
    msg: "agy {{ dev_workstation_agy_version.stdout }}"

- name: Create ~/src for repos (cloning needs user auth — user step)
  become: false
  ansible.builtin.file:
    path: "/home/{{ dev_workstation_user }}/src"
    state: directory
    mode: "0755"

# ── Orchestrator-seat toolchain (task 014, ADR 0006) ─────────────────────
# This box is the orchestrator seat: terraform (parity-pinned — the state
# must be verified on the same version that wrote it), sops + age (SOPS
# decrypt), kubectl (both clusters), uv/uvx (plane MCP).

# The user VLAN's router advertisements hand out a global IPv6 address and
# default route whose egress is dead (task 014 failure-1). curl falls back
# to IPv4 in milliseconds (happy-eyeballs); Python HTTP clients — ansible
# get_url below, ansible-galaxy, pip — do not, and hang for minutes per
# address. Prefer IPv4 for dual-stack destinations until v6 egress actually
# works end-to-end; remove this line once it does. Must precede the
# get_url tasks below.
- name: Prefer IPv4 for dual-stack lookups (dead v6 egress on this VLAN)
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    regexp: '^precedence ::ffff:0:0/96'
    line: "precedence ::ffff:0:0/96  100"
    create: true
    mode: "0644"

- name: Add HashiCorp apt key (dearmored)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://apt.releases.hashicorp.com/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    executable: /bin/bash

- name: Add HashiCorp apt repo
  ansible.builtin.deb822_repository:
    name: hashicorp
    uris: https://apt.releases.hashicorp.com
    suites: noble
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/hashicorp-archive-keyring.gpg

- name: Install terraform (parity pin — see defaults)
  ansible.builtin.apt:
    name: "terraform={{ dev_workstation_terraform_version }}-*"
    state: present
    update_cache: true

- name: Install age (apt)
  ansible.builtin.apt:
    name: age
    state: present

- name: Install sops (pinned release binary; pinned sha256 is the trust anchor)
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ dev_workstation_sops_version }}/sops-v{{ dev_workstation_sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    mode: "0755"
    checksum: "sha256:{{ dev_workstation_sops_sha256 }}"

- name: Add Kubernetes apt key (dearmored)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL "https://pkgs.k8s.io/core:/stable:/v{{ dev_workstation_kubectl_minor }}/deb/Release.key" \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    executable: /bin/bash

- name: Add Kubernetes apt repo (pinned minor — bump with cluster upgrades)
  ansible.builtin.deb822_repository:
    name: kubernetes
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ dev_workstation_kubectl_minor }}/deb/"
    suites: /
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true

- name: Download uv release tarball (pinned version + sha256)
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ dev_workstation_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: "/usr/local/src/uv-{{ dev_workstation_uv_version }}.tar.gz"
    mode: "0644"
    checksum: "sha256:{{ dev_workstation_uv_sha256 }}"

- name: Install uv/uvx to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/usr/local/src/uv-{{ dev_workstation_uv_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1"]
