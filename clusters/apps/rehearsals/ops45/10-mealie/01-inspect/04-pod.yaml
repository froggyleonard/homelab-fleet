apiVersion: v1
kind: Pod
metadata:
  name: ops45-mealie-files-inspect
  labels:
    app.kubernetes.io/part-of: ops45-restore
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: ops45-mealie-files-inspect
  namespace: ops45-restore
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  activeDeadlineSeconds: 86400
  nodeSelector:
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: inspect
    image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    command:
    - sleep
    - '86400'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    volumeMounts:
    - name: data
      mountPath: /restore
      readOnly: true
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ops45-mealie-files
      readOnly: true
