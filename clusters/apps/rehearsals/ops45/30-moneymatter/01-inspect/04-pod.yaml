apiVersion: v1
kind: Pod
metadata:
  name: ops45-moneymatter-restore
  labels:
    app.kubernetes.io/part-of: ops45-restore
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: ops45-moneymatter-restore
  namespace: ops45-restore
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: postgres
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    command:
    - bash
    - -ceu
    args:
    - |
      umask 077
      test ! -e "$PGDATA/PG_VERSION" || exit 30
      if [ ! -s "$PGDATA/PG_VERSION" ]; then
        initdb -D "$PGDATA" --username=ops45_admin --auth-local=trust --auth-host=reject >/dev/null 2>&1
      fi
      printf '%s\n' \
        'local all ops45_admin trust' \
        'local all all scram-sha-256' \
        'host all all 0.0.0.0/0 reject' \
        'host all all ::/0 reject' > "$PGDATA/pg_hba.conf"
      exec postgres -D "$PGDATA" \
        -c listen_addresses= -c unix_socket_directories=/tmp \
        -c log_statement=none -c log_min_error_statement=panic \
        -c log_parameter_max_length_on_error=0 >/dev/null 2>&1
    env:
    - name: POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
    - name: tmp
      mountPath: /tmp
    readinessProbe:
      exec:
        command:
        - pg_isready
        - -h
        - /tmp
        - -U
        - ops45_admin
        - -d
        - postgres
      initialDelaySeconds: 5
      periodSeconds: 5
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ops45-moneymatter-db
  - name: tmp
    emptyDir:
      sizeLimit: 128Mi
  activeDeadlineSeconds: 86400
