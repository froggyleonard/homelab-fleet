# The v1.12.0 RecurringJob controller does not expose pod resources. Admission
# supplies defaults to newly created containers, including backup jobs. This
# also affects future replacement Longhorn pods; existing pods are untouched.
# Explicit requests/limits win. These are defaults, not namespace maxima.
apiVersion: v1
kind: LimitRange
metadata:
  name: longhorn-container-defaults
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 128Mi
    default:
      cpu: '2'
      memory: 4Gi
