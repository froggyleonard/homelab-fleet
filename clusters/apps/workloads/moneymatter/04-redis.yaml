apiVersion: v1
kind: Service
metadata:
  name: moneymatter-redis
  namespace: moneymatter
  labels:
    app.kubernetes.io/name: moneymatter
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: moneymatter
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: moneymatter-redis
  namespace: moneymatter
  labels:
    app.kubernetes.io/name: moneymatter
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: moneymatter-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moneymatter
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneymatter
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: redis
          image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
