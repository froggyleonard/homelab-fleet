# nginx serving the SPA and reverse-proxying the API. Listens on 80 — this is the
# pod port the NetworkPolicy must name, not the Service port.
apiVersion: v1
kind: Service
metadata:
  name: moneymatter-frontend
  namespace: moneymatter
  labels:
    app.kubernetes.io/name: moneymatter
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: moneymatter
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneymatter-frontend
  namespace: moneymatter
  labels:
    app.kubernetes.io/name: moneymatter
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moneymatter
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneymatter
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: frontend
          image: letehaha/budget-tracker-fe:sha-2585df4@sha256:815a97165a5f1fe9df8d0254e5b1cf0a02976015a5a19eb9b868b4b2bbbc65ea
          # The pinned image's entrypoint renders its includes before exec-ing
          # these args. Copy into that writable include; do not mount over it,
          # because startup would otherwise try to overwrite a read-only file.
          args:
            - /bin/sh
            - -ec
            - |
              cp /etc/moneymatter-oauth/oauth-mcp.conf /etc/nginx/includes/oauth-mcp.conf
              exec nginx -g 'daemon off;'
          volumeMounts:
            - name: oauth-metadata
              mountPath: /etc/moneymatter-oauth
              readOnly: true
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: moneymatter-frontend-config
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: oauth-metadata
          configMap:
            name: moneymatter-oauth-metadata
