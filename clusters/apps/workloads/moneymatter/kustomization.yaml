apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-netpol.yaml
  - 02-configmap.yaml
  - 03-postgres.yaml
  - 04-redis.yaml
  - 05-currency-rates.yaml
  - 06-backend.yaml
  - 07-frontend.yaml
  - 08-ingressroute.yaml
  - 09-backup.yaml
generators:
  - ksops-generator.yaml
# Hash-suffixed config makes metadata edits roll the frontend automatically.
configMapGenerator:
  - name: moneymatter-oauth-metadata
    namespace: moneymatter
    files:
      - oauth-mcp.conf
    options:
      labels:
        app.kubernetes.io/name: moneymatter
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
