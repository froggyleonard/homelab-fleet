# Workaround for upstream v0.27.4 OAuth issuer mismatch (OPS-42).
# Better Auth identifies itself as the canonical origin + /api/v1/auth, but
# oauth-metadata.route.ts advertises the bare origin. Strict clients reject
# the callback. Keep issuer validation enabled; correct public metadata here.
# Proxy locations below retain the pinned frontend entrypoint's behavior.
# Remove this override once upstream discovery matches its callback issuer.

location = /mcp {
  proxy_pass http://moneymatter-backend:8081;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Connection "";
  # MCP responses stream over SSE; buffering would stall them.
  proxy_buffering off;
  proxy_read_timeout 3600s;
}
# Clients differ on whether the pasted MCP URL keeps a trailing slash; without
# this a "/mcp/" connector lands on the SPA fallback and fails confusingly.
location = /mcp/ {
  rewrite ^ /mcp last;
}

# Claude.ai ignores the endpoints advertised in the metadata and calls
# /authorize, /token and /register on the origin root. The backend answers
# those with 307s to their real /api/v1/auth/oauth2/* paths.
location = /authorize {
  proxy_pass http://moneymatter-backend:8081;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location = /token {
  proxy_pass http://moneymatter-backend:8081;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location = /register {
  proxy_pass http://moneymatter-backend:8081;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

set $mm_authorization_metadata '{"issuer":"https://money.froggyleonard.com/api/v1/auth","authorization_endpoint":"https://money.froggyleonard.com/api/v1/auth/oauth2/authorize","token_endpoint":"https://money.froggyleonard.com/api/v1/auth/oauth2/token","registration_endpoint":"https://money.froggyleonard.com/api/v1/auth/oauth2/register","revocation_endpoint":"https://money.froggyleonard.com/api/v1/auth/oauth2/revoke","introspection_endpoint":"https://money.froggyleonard.com/api/v1/auth/oauth2/introspect","jwks_uri":"https://money.froggyleonard.com/api/v1/auth/.well-known/jwks.json","response_types_supported":["code"],"grant_types_supported":["authorization_code","refresh_token"],"token_endpoint_auth_methods_supported":["client_secret_basic","client_secret_post","none"],"code_challenge_methods_supported":["S256"],"scopes_supported":["finance:read","finance:write","finance:delete","profile:read","offline_access"]}';
set $mm_resource_metadata '{"resource":"https://money.froggyleonard.com/mcp","authorization_servers":["https://money.froggyleonard.com/api/v1/auth"],"scopes_supported":["finance:read","finance:write","finance:delete","profile:read","offline_access"],"bearer_methods_supported":["header"]}';

location = /.well-known/oauth-authorization-server {
  default_type application/json;
  add_header Cache-Control "no-store" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  return 200 $mm_authorization_metadata;
}
location = /.well-known/oauth-authorization-server/mcp {
  default_type application/json;
  add_header Cache-Control "no-store" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  return 200 $mm_authorization_metadata;
}
location = /.well-known/oauth-authorization-server/api/v1/auth {
  default_type application/json;
  add_header Cache-Control "no-store" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  return 200 $mm_authorization_metadata;
}
location = /.well-known/oauth-protected-resource {
  default_type application/json;
  add_header Cache-Control "no-store" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  return 200 $mm_resource_metadata;
}
location = /.well-known/oauth-protected-resource/mcp {
  default_type application/json;
  add_header Cache-Control "no-store" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  return 200 $mm_resource_metadata;
}
