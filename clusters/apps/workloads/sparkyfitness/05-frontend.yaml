# SparkyFitness frontend — the React SPA plus a bundled nginx that reverse
# proxies /api/, /uploads/, /health-data and /mcp back to the server. It is
# stateless: no database, no secrets.
#
# Runs as UID 101 (nginx). The image declares no USER, so this is set
# explicitly; because it is non-root the entrypoint selects nginx's non-root
# listen port, 8080 — hence the Service, probes, NetworkPolicy and
# IngressRoute all target 8080 rather than 80, and no NET_BIND_SERVICE
# capability is needed.
#
# readOnlyRootFilesystem needs four writable mounts. /run is one of them and
# must NOT be written as /var/run: in nginx-alpine /var/run is a symlink to
# /run, and mounting over the symlink leaves nginx unable to write its pid
# file, so `nginx -t` aborts and the pod crashloops. That is the same symlink
# collision that broke the Mealie deploy (task 020 failure 1), reached from
# the opposite direction.
#
# /etc/nginx/conf.d is writable because the entrypoint envsubsts the rendered
# config into it at startup.
#
# Startup ordering note: nginx.conf carries no `resolver`, so proxy_pass
# resolves its upstream at config-parse time and the entrypoint exits 1 if
# the name does not resolve. This is DNS, not readiness — a ClusterIP Service
# resolves as soon as the Service object exists, and kustomize applies the
# server Service in the same sync, so the frontend starts cleanly while the
# server is still running migrations.
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-frontend
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkyfitness-frontend
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkyfitness
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkyfitness
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/codewithcj/sparkyfitness-frontend:v1.6.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NGINX_LISTEN_PORT
              value: "8080"
            - name: SPARKY_FITNESS_SERVER_HOST
              value: sparkyfitness-server
            - name: SPARKY_FITNESS_SERVER_PORT
              value: "3010"
            - name: SPARKY_FITNESS_FRONTEND_URL
              value: https://fitness.apps.froggyleonard.com
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # The entrypoint renders the nginx config here via envsubst.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            # Must be /run, never /var/run — see the header comment.
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          # Probe "/" — the frontend nginx deliberately denies /api/health
          # (403), so that path only works against the server pod.
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
