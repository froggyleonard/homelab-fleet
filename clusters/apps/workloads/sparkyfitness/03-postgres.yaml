# Dedicated PostgreSQL for SparkyFitness — native-DB-per-app doctrine.
# 18.6 is the current 18.x minor (2026-08-13 security release); upstream's
# compose still pins 18.3, and v1.6.1 release notes drop support for older
# majors, so 18.x is required and 18.6 is the safe minor within it.
#
# POSTGRES_USER is the owner/superuser the server connects as to run
# migrations. It needs CREATEROLE because the server creates its own limited
# runtime role (SPARKY_FITNESS_APP_DB_USER) on first boot — superuser
# satisfies that inherently, so no init SQL is needed here.
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-postgres
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: sparkyfitness-postgres
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: sparkyfitness-postgres-hl
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sparkyfitness-postgres
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sparkyfitness-postgres
  namespace: sparkyfitness
  labels:
    app.kubernetes.io/name: sparkyfitness-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: sparkyfitness-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkyfitness-postgres
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkyfitness-postgres
        app.kubernetes.io/component: db
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              value: sparkyfitness
            - name: POSTGRES_DB
              value: sparkyfitness
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparkyfitness-secrets
                  key: pg-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, sparkyfitness, -h, 127.0.0.1]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, sparkyfitness, -h, 127.0.0.1]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: sparkyfitness-postgres
          app.kubernetes.io/part-of: fleet
          app.kubernetes.io/managed-by: argocd
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
