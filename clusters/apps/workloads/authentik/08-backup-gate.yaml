# One fixed, retained backup gate after the accepted final import, while both
# Authentik components remain frozen. This is a normal Job, not an Argo hook.
# The suspended CronJob supplies the unchanged backup payload. Job-only
# controls bound execution time and prevent automatic retries after failure.
# Do not delete or rename this Job to retry: ArgoCD would create it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-pg-backup-ops2-final-gate
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: authentik-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-postgres
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: pg-dump
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: docker.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          env:
            - name: PGHOST
              value: authentik-postgres.authentik.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: authentik
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-postgres-admin
                  key: password
          command:
            - /bin/bash
            - -ceu
            - -o
            - pipefail
            - |
              umask 077
              ts="$(date -u +%Y-%m-%dT%H%M%SZ)"
              mkdir -p /backups/runs
              run="$(mktemp -d "/backups/runs/.partial-$ts.XXXXXX")"
              trap 'rm -rf -- "$run"' ERR

              pg_dumpall --globals-only --database=postgres \
                -f "$run/authentik-globals.sql"
              test -s "$run/authentik-globals.sql"
              # The completion trailer must precede any final psql guard.
              tail -n 10 "$run/authentik-globals.sql" \
                | grep -Fxq -- '-- PostgreSQL database cluster dump complete'
              # Check exact, correctly quoted role statements without
              # printing identities or the secret-bearing SQL contents.
              psql -X -v ON_ERROR_STOP=1 -At -d postgres -c \
                "select format('CREATE ROLE %I;', rolname) from pg_roles where rolcanlogin order by 1" \
                | while IFS= read -r role_statement; do
                    grep -Fxq -- "$role_statement" "$run/authentik-globals.sql" \
                      || { echo 'FAIL: globals role coverage'; exit 1; }
                  done

              pg_dump -Fc -f "$run/authentik.dump"
              test -s "$run/authentik.dump"
              pg_restore --list "$run/authentik.dump" > /dev/null
              {
                echo "run=$ts"
                echo 'artifact-count=2'
                echo 'restore-order=authentik-globals.sql,authentik.dump'
                (cd "$run" && stat -c '%n %s bytes' authentik-globals.sql authentik.dump)
                (cd "$run" && sha256sum authentik-globals.sql authentik.dump)
              } > "$run/MANIFEST"

              # Partial runs cannot count as retained successful sets.
              # Publish the whole checked generation with one symlink swap.
              run_name="${run##*/}"
              run_name="${run_name#.partial-}"
              published="/backups/runs/$run_name"
              mv -- "$run" "$published"
              run="$published"
              ln -sfn "runs/$run_name" /backups/.current.tmp
              mv -Tf /backups/.current.tmp /backups/current
              # Retention failure must never delete the published run.
              trap - ERR

              # Keep the current set plus six other completed generations.
              # Excluding current also protects it if the clock moved back.
              find /backups/runs -mindepth 1 -maxdepth 1 -type d \
                -name '20*T*Z.*' ! -path "$run" | sort | head -n -6 | xargs -r rm -rf --
              echo "published $run_name"
          volumeMounts:
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: authentik-pg-backups
