# Fixed, retained reader for the completed native backup gate. Wave 1 waits for
# the ordinary wave-0 Job to finish before mounting its retained backup claim.
# This Pod runs no database/client startup and has no credentials or networking.
# Do not remove/re-add its manifest or delete it as an implicit recreation.
apiVersion: v1
kind: Pod
metadata:
  name: authentik-pg-backup-ops2-final-reader
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: authentik-postgres
    app.kubernetes.io/component: backup-reader
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  # No fsGroup here: a read-only consumer must not request ownership changes.
  # The backup writer owns its private directories/files as the same UID/GID.
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: backup-reader
      image: docker.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      # Override the image entrypoint: no initdb, database connection or writes.
      # The 55-minute idle normally completes before the one-hour hard deadline.
      command: ["sleep", "3300"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: backups
          mountPath: /backups
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
  volumes:
    - name: backups
      persistentVolumeClaim:
        claimName: authentik-pg-backups
        readOnly: true
