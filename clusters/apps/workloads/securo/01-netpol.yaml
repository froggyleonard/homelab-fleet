# Default-deny both directions, then explicit allows.
#
# Component labels come from the chart and were read off a rendered manifest,
# not guessed: backend, frontend, celery-worker, celery-beat, migration,
# postgresql, redis. The backup CronJob sets component=backup itself.
#
# Traefik needs TWO ingress rules, not one: the IngressRoute sends /api straight
# to the backend, so allowing Traefik to reach only the frontend would break
# every API call. The migration Job needs egress to PostgreSQL before any
# application pod is useful; omitting it makes the Job retry until it fails.
#
# The 443 egress rule deliberately selects backend and worker only — they are
# the pods that call SimpleFIN and Authentik. Its 0.0.0.0/0 breadth also permits
# private-range HTTPS; that is the same accepted risk as the Mealie precedent and
# is recorded in the task 026 plan rather than solved here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: securo
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securo-web-ingress
  namespace: securo
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securo
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securo-backend-ingress
  namespace: securo
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securo
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    # Traefik reaches the backend directly for the /api PathPrefix route.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8000
          protocol: TCP
    # The draupnir automation layer calls the REST API in-cluster, never via the
    # public hostname. n8n also needs a matching EGRESS rule in its own
    # namespace policy — allowing ingress here is not sufficient.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securo-datastore-ingress
  namespace: securo
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [postgresql, redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, celery-worker, celery-beat, migration, backup]
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securo-egress
  namespace: securo
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # DNS for every pod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Datastores, same namespace. Covers backend, worker, beat, migration and
    # the backup CronJob.
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [postgresql, redis]
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securo-external-https
  namespace: securo
  labels:
    app.kubernetes.io/name: securo
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  # Only the pods that actually make outbound calls: SimpleFIN bank sync and the
  # Authentik OIDC discovery/token/JWKS endpoints, which are reached over the
  # canonical public issuer hostname. The backup CronJob is deliberately absent —
  # it only ever writes to a PVC.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, celery-worker]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
