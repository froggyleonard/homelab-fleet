# Dedicated PostgreSQL preparation. The app remains on its retained source.
# PostgreSQL 18.6-trixie uses the same reviewed image digest as the existing
# dedicated Authentik database. Local rehearsal precedes the final single import.
# Provision the dedicated n8n-postgres-admin/password SOPS Secret first.
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgres
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgres-hl
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n-postgres
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: n8n-postgres-hl
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-postgres
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-postgres
        app.kubernetes.io/component: db
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            # Set explicit encoding/libc locale; verify source compatibility before restore.
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=en_US.utf8 --auth-host=scram-sha-256 --auth-local=trust"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-postgres-admin
                  key: password
            # Keep this target fresh until the accepted final single import.
            # Rehearse in a disposable local PostgreSQL instance first.
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          startupProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres, -h, 127.0.0.1]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres, -h, 127.0.0.1]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres, -h, 127.0.0.1]
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
        labels:
          app.kubernetes.io/name: n8n-postgres
          app.kubernetes.io/component: db
          app.kubernetes.io/part-of: fleet
          app.kubernetes.io/managed-by: argocd
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
