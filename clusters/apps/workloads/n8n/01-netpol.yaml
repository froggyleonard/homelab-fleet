# Default-deny; UI/webhooks in via Traefik only. App egress: DNS, shared PG,
# Synapse client API (matrix ns :8008 — notification bot),
# Traefik entrypoints (workflows call *.apps services via the cluster
# ingress), and 443/80 out — workflows call external APIs by design.
# The app selector excludes the dedicated database and backup components.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-ingress
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 5678
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-egress
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix
      ports:
        - port: 8008
          protocol: TCP
    # *.apps hostnames resolve to the Traefik LB; post-DNAT the destination
    # is the traefik pod (:8443 websecure), which the 0.0.0.0/0 ipBlock below
    # never matches — Cilium CIDR rules apply to cluster-external traffic
    # only. Without this rule, workflow calls to any *.apps URL time out.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

---
# The new database remains isolated during preparation and local rehearsal.
# Backup egress below is ineffective until a separately reviewed DB ingress gate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-postgres-deny
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n-postgres
      app.kubernetes.io/component: db
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Backup pods can only resolve DNS and reach the dedicated database when its
# separate ingress gate is opened. No policy grants database egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-postgres-backup
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n-postgres
      app.kubernetes.io/component: backup
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n-postgres
              app.kubernetes.io/component: db
      ports:
        - port: 5432
          protocol: TCP
