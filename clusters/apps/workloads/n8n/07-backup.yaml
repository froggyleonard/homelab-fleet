# Native backup scaffold. This CronJob stays suspended until the
# restored DB, restricted network access and backup/restore gates are proven.
# The operational backup PVC does not replace the seat's disaster backup.
#
# Each successful generation pairs globals SQL with an n8n custom-format
# dump. Restore globals with psql BEFORE pg_restore; bootstrap-role conflicts
# must be resolved by the reviewed restore procedure, never by ignoring errors.
# Globals contain password hashes, and both artifacts are secret-bearing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pg-backups
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-pg-backup
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  suspend: true
  schedule: "35 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: n8n-postgres
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: fleet
            app.kubernetes.io/managed-by: argocd
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              image: docker.io/library/postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
              env:
                - name: PGHOST
                  value: n8n-postgres.n8n.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: n8n
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: n8n-postgres-admin
                      key: password
              command:
                - /bin/bash
                - -ceu
                - -o
                - pipefail
                - |
                  umask 077
                  ts="$(date -u +%Y-%m-%dT%H%M%SZ)"
                  mkdir -p /backups/runs
                  run="$(mktemp -d "/backups/runs/.partial-$ts.XXXXXX")"
                  trap 'rm -rf -- "$run"' ERR

                  pg_dumpall --globals-only --database=postgres \
                    -f "$run/n8n-globals.sql"
                  test -s "$run/n8n-globals.sql"
                  # The completion trailer must precede any final psql guard.
                  tail -n 10 "$run/n8n-globals.sql" \
                    | grep -Fxq -- '-- PostgreSQL database cluster dump complete'
                  # Check exact, correctly quoted role statements without
                  # printing identities or the secret-bearing SQL contents.
                  psql -X -v ON_ERROR_STOP=1 -At -d postgres -c \
                    "select format('CREATE ROLE %I;', rolname) from pg_roles where rolcanlogin order by 1" \
                    | while IFS= read -r role_statement; do
                        grep -Fxq -- "$role_statement" "$run/n8n-globals.sql" \
                          || { echo 'FAIL: globals role coverage'; exit 1; }
                      done

                  pg_dump -Fc -f "$run/n8n.dump"
                  test -s "$run/n8n.dump"
                  pg_restore --list "$run/n8n.dump" > /dev/null
                  {
                    echo "run=$ts"
                    echo 'artifact-count=2'
                    echo 'restore-order=n8n-globals.sql,n8n.dump'
                    (cd "$run" && stat -c '%n %s bytes' n8n-globals.sql n8n.dump)
                    (cd "$run" && sha256sum n8n-globals.sql n8n.dump)
                  } > "$run/MANIFEST"

                  # Partial runs cannot count as retained successful sets.
                  # Publish the whole checked generation with one symlink swap.
                  run_name="${run##*/}"
                  run_name="${run_name#.partial-}"
                  published="/backups/runs/$run_name"
                  mv -- "$run" "$published"
                  run="$published"
                  ln -sfn "runs/$run_name" /backups/.current.tmp
                  mv -Tf /backups/.current.tmp /backups/current
                  # Retention failure must never delete the published run.
                  trap - ERR

                  # Keep the current set plus six other completed generations.
                  # Excluding current also protects it if the clock moved back.
                  find /backups/runs -mindepth 1 -maxdepth 1 -type d \
                    -name '20*T*Z.*' ! -path "$run" | sort | head -n -6 | xargs -r rm -rf --
                  echo "published $run_name"
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: n8n-pg-backups
