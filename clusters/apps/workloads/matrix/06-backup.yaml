# Nightly logical backup of BOTH databases on the dedicated instance
# (synapse + mas), newest 7 each retained
# (count-based, not -mtime: a stalled CronJob must never age out the last
# good dump). Every dump is integrity-checked with pg_restore --list.
# SCOPE: this PVC protects against DB corruption and accidental workload
# pruning. It is NOT a disaster backup — it lives in this namespace and dies
# with it. Any gated teardown first copies the newest dump off-namespace
# (seat → offline medium) and re-verifies it there.
# Media (/media_store) is deliberately NOT backed up: disposable-content
# policy (ADR 0007) — restores recover accounts/rooms/full message text, not
# attachments.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matrix-pg-backups
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: matrix-pg-backup
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          # component=backup grants this pod DB access via pg-ingress and
          # keeps it out of the Service endpoints.
          labels:
            app.kubernetes.io/name: matrix-postgres
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: fleet
            app.kubernetes.io/managed-by: argocd
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18.6
              env:
                - name: PGHOST
                  value: matrix-postgres.matrix.svc.cluster.local
                - name: PGUSER
                  value: synapse
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: matrix-secrets
                      key: pg-password
              command:
                - /bin/bash
                - -ceu
                - -o
                - pipefail
                - |
                  # Both authoritative DBs: synapse (rooms/events, legacy
                  # "matrix-" prefix kept for retention continuity) and mas
                  # (identity links, sessions, imported hashes).
                  declare -A prefix=([synapse]=matrix [mas]=mas)
                  for db in synapse mas; do
                    out="/backups/${prefix[$db]}-$(date +%F-%H%M).dump"
                    pg_dump -Fc -d "$db" -f "$out"
                    pg_restore --list "$out" > /dev/null
                    echo "wrote $out ($(du -h "$out" | cut -f1))"
                    ls -1t /backups/${prefix[$db]}-*.dump | tail -n +8 | xargs -r rm --
                  done
                  echo "retained:"; ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: matrix-pg-backups
