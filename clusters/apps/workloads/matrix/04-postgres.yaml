# Dedicated PostgreSQL for Synapse — first app under the native-DB-per-app
# doctrine (never a shared-PG tenant). C-locale initdb is a hard Synapse
# requirement.
apiVersion: v1
kind: Service
metadata:
  name: matrix-postgres
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  # component=db keeps the backup job pods (which share the app name label)
  # out of the endpoint set.
  selector:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-postgres-hl
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-postgres
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: matrix-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-postgres
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-postgres
        app.kubernetes.io/component: db
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              value: synapse
            - name: POSTGRES_DB
              value: synapse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-secrets
                  key: pg-password
            # Synapse refuses non-C collation; the whole dedicated instance
            # is C-locale by construction.
            - name: POSTGRES_INITDB_ARGS
              value: "--locale=C --encoding=UTF8"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, synapse, -h, 127.0.0.1]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, synapse, -h, 127.0.0.1]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: matrix-postgres
          app.kubernetes.io/part-of: fleet
          app.kubernetes.io/managed-by: argocd
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
