apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`matrix.apps.froggyleonard.com`)
      kind: Rule
      services:
        - name: synapse
          port: 8008
    # Full MAS surface on the auth host (public: auth.froggyleonard.com via
    # tunnel host-translation). NOTE: the matrix-host compat split
    # (login/logout/refresh → MAS) deliberately does NOT exist yet — it
    # lands in the cutover PR once MAS is serving (a route to a
    # zero-replica Service would blackhole logins).
    - match: Host(`auth.apps.froggyleonard.com`)
      kind: Rule
      services:
        - name: mas
          port: 8080
