# Mealie v3.23.1 (2026-08-18 upstream release, verified live at authoring).
# Single combined image — the two-container split in old community charts is
# v0.x-era and stale.
#
# THE PVC IS IDENTITY, NOT JUST DATA. Mealie has no SECRET env var: it
# generates /app/data/.secret on first boot and signs every session AND every
# API token with it. Losing this volume invalidates the Home Assistant
# integration token and the grocery bot's token, silently. Never recreate it
# casually.
#
# Runs as 911:911. The stock entrypoint normally starts as root, chowns, then
# gosu-drops to PUID/PGID — but it explicitly tolerates being started as the
# target uid, in which case it skips the chown/gosu path entirely. fsGroup
# handles volume permissions instead.
#
# OIDC is deliberately absent here: the Authentik application (and therefore
# oidc-client-secret) does not exist yet, and referencing a missing key would
# stop the pod from booting. It lands in a follow-up PR — see task 020
# PLAN.md Amendment A1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  # RWO volume + single-writer app: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsUser: 911
        runAsGroup: 911
        runAsNonRoot: true
        fsGroup: 911
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.23.1
          env:
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
            - name: TZ
              value: America/New_York
            - name: BASE_URL
              value: https://mealie.apps.froggyleonard.com
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: mealie-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_USER
              value: mealie
            # _FILE indirection is handled by the stock entrypoint and still
            # applies after the privilege drop.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/pg-password
            - name: ALLOW_SIGNUP
              value: "false"
            # Local login is the path until OIDC is verified end to end;
            # disabled by a later PR (frozen plan M1 step 7).
            - name: ALLOW_PASSWORD_LOGIN
              value: "true"
            - name: UVICORN_WORKERS
              value: "1"
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: pg-secret
              mountPath: /run/secrets
              readOnly: true
          # /api/app/about is unauthenticated by design.
          startupProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              # Explicit memory limit is a docs recommendation — Python
              # pre-allocates without one.
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
        - name: pg-secret
          secret:
            secretName: mealie-secrets
            defaultMode: 0440
            items:
              - key: pg-password
                path: pg-password
