apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-web
  namespace: sure
  labels:
    app.kubernetes.io/name: sure
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sure
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: fleet
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: web
          image: ghcr.io/we-promise/sure:0.7.4-alpha.6
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: sure-secrets
          env:
            - name: RAILS_ENV
              value: production
            - name: SELF_HOSTED
              value: "true"
            # Public name on purpose. APP_DOMAIN feeds only
            # action_mailer.default_url_options and the WebAuthn RP-ID fallback,
            # so emailed links (password reset, confirmation) have to use the
            # name that resolves off-LAN. Request-driven redirects come from the
            # inbound Host, not from here.
            - name: APP_DOMAIN
              value: sure.froggyleonard.com
            - name: REDIS_URL
              value: redis://redis.sure.svc.cluster.local:6379/0
            - name: EXCHANGE_RATE_PROVIDER
              value: yahoo_finance
            - name: SECURITIES_PROVIDER
              value: yahoo_finance
            - name: AI_DEBUG_MODE
              value: "false"
            # --- Authentik SSO guard rails (task 020, Amendment A4) ---
            # The OIDC PROVIDER is configured in-app at /admin/sso_providers and
            # lives in the database, so no client secret belongs here. These
            # three are different: AuthConfig reads them from
            # Rails.configuration.x.auth.*, which config/initializers/auth.rb
            # populates at BOOT from config/auth.yml (ERB over ENV.fetch). They
            # cannot be set in the admin UI, and changing them restarts the pod.
            #
            # link_only is the important one. The upstream default,
            # create_and_link, creates a new user AND A NEW FAMILY when the SSO
            # email matches no existing user — the documented duplicate-family
            # failure. link_only turns that into a clean rejection at the login
            # page instead. It must be in force BEFORE any SSO login is
            # possible, which is why this lands before the provider is
            # configured in-app rather than alongside it.
            #
            # ALLOWED_OIDC_DOMAINS is deliberately unset: it only restricts JIT
            # creation, and link_only disables JIT outright.
            - name: AUTH_JIT_MODE
              value: link_only
            # Break-glass. Once AUTH_LOCAL_LOGIN_ENABLED goes false, super
            # admins can still sign in with a password while everyone else is
            # SSO-only. Set now so that later change is one line and cannot
            # lock us out of the finance app.
            - name: AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED
              value: "true"
            # Stays true until SSO is proven end to end.
            - name: AUTH_LOCAL_LOGIN_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sure
  namespace: sure
  labels:
    app.kubernetes.io/name: sure
    app.kubernetes.io/part-of: fleet
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: sure
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
